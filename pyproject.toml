[project]
name = "desk-proxy"
version = "0.1.0"
description = "Non-MCP CLI proxy for Linux desktop automation — screenshots, input, OCR, HITL (tick/mail/tg ADN)"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15.1",
    "pydantic>=2.10.6",
    "rich>=13.9.4",
    "Pillow>=11.0.0",
]

[project.scripts]
desk-proxy = "desk_proxy.cli:app"

[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.9.0",
    "pyright>=1.1.300",
]

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportAttributeAccessIssue = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
